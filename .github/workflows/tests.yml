name: Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)

      - name: Validate HTML
        run: npm run validate:html

      - name: Run regression tests
        run: npm test

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run XML browser smoke test
        shell: bash
        run: |
          python3 -m http.server 8766 >/tmp/bsol-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          server_ready=false
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8766/test/xml-smoke.html >/dev/null; then
              server_ready=true
              break
            fi
            sleep 1
          done
          if [ "$server_ready" != true ]; then
            cat /tmp/bsol-http.log
            exit 1
          fi

          google-chrome \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --dump-dom \
            http://127.0.0.1:8766/test/xml-smoke.html \
            | grep --fixed-strings --quiet "BSOL XML smoke test: PASS"
