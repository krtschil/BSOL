<body id="bdy">

<div id="ruler">
</div>
<div id="dropzone"><!-- Area for pasting PBN/LIN data or dropping a file with PBN/LIN content-->
    <fieldset id="data">
        <legend id="data-legend"><span id="flegend"><b>Analysiere Bridgehände (PBN/LIN/DLM): Datei/manuell eingeben/Paste/Drop</b></span>&nbsp;
            <button id="switchEnglish" type="button" title="English" aria-label="Switch language to English"><img alt="" src="pics/gb.gif"/></button>
            <img id="empty" title="white space" alt="" src="pics/empty.gif"/>
            <button id="switchGerman" type="button" title="Deutsch" aria-label="Sprache auf Deutsch umschalten"><img alt="" src="pics/de.gif"/></button>
            <span id="filename"></span></legend>

        <form id="input-file" method="post" action="." enctype="multipart/form-data"><!-- label for="loadFile1">Datei ausw&auml;hlen:</label -->
            <label for="loadFile" id="loadFileLabel">Datei auswählen</label>
            <input type="button" id="loadFile1" value="Datei auswählen" aria-label="Datei auswählen"/>
            <input title="File chooser" type="file" accept=".pbn,.lin,.dlm" id="loadFile" name="loadfiles[]" aria-label="Bridge-Datei auswählen"/>
        </form>

        <!-- Buttons are handled by event triggers (see events.js)-->
        <button id="blankInput"         type="button">Hand manuell eingeben</button>
        <button id="clipboard"          type="button">Hole Boards aus der Zwischenablage</button>
        <button id="showGeneralHelp"    type="button">Allgemeine Hilfe</button>
        <button id="video-i"            type="button">Erklärvideo</button>
        <button id="author-reference-i" type="button">BSOL (John Goacher)</button>

    </fieldset>
</div>

<div id="abuttons">
	<div id="abuttons-content">
		<button type="button" class="menuButton"        id="aboard">    Nochmal spielen</button>
		<button type="button" class="sessionMenuButton" id="aranking">  Alle Paare</button>
		<button type="button" class="sessionMenuButton" id="ascorecard">Personal</button>
		<button type="button" class="sessionMenuButton" id="aacc">      Genauigkeit</button>
		<button type="button" class="sessionMenuButton" id="atraveller">Board</button>
		<button type="button" class="sessionMenuButton" id="aprev">     &lt;</button>
		<button type="button" class="sessionMenuButton" id="agotoboard">Gehe zu..</button>
		<button type="button" class="sessionMenuButton" id="anext">     &gt;</button>
		<button type="button" class="sessionMenuButton" id="acheck">    Überprüfen</button>
		<button type="button" class="sessionMenuButton" id="ahelp">     Hilfe</button>
	</div>
	<div class="inlr1"></div>
</div>
